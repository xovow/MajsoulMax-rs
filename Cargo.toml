[package]
name = "majsoul_max_rs"
version = "0.7.0"
edition = "2024"

[lib]

[[bin]]
name = "majsoul_max_rs"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { version = "1", default-features = false }
bytes = { version = "1", default-features = false }
prost-types = "0.14"
# 0.13 起 rustls-tls 拆成 rustls + 证书源；0.12 的 rustls-tls 等价于二者之和
reqwest = { version = "0.13", features = [
    "rustls",
    "webpki-roots",
    "json",
], default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
# derive/std 原先靠其他依赖的特性合并偶然带入，显式声明避免依赖树一变就炸
serde = { version = "1", features = ["derive", "std"], default-features = false }
tokio = { version = "1", features = ["fs", "net", "rt-multi-thread", "sync", "time"] }
# 调试日志（settings.json 的 debugLog）通过 tracing 写文件。编译期上限为 debug，
# 运行时再由过滤器决定：本 crate 记 debug，代理依赖（hudsucker 等）只记 warn/error。
# 未开启调试日志时不安装订阅器，每个调用点只剩一次原子读取。
tracing = { version = "0.1", features = ["max_level_debug", "release_max_level_debug", "std"], default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std"], default-features = false }
tracing-appender = { version = "0.2", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
prost = { version = "0.14", default-features = false }
hudsucker = { version = "0.25", features = [
    "rcgen-ca",
    "rustls-client",
], default-features = false }
rand = { version = "0.10", features = ["thread_rng"], default-features = false }

[build-dependencies]
prost = { version = "0.14", default-features = false }
prost-build = { version = "0.14", default-features = false }
prost-types = "0.14"

# The desktop shell is intentionally Windows-only.  Keeping these dependencies
# target-specific means the proxy/modder library remains independent of the
# WebView2/GUI stack, while Windows release builds get a native WebView2 host.
[target.'cfg(windows)'.dependencies]
tao = "0.30"
wry = "0.45"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
