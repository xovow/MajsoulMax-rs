name: build

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  APT_PACKAGES: "build-essential pkg-config libclang-dev"
  BIN_NAME: majsoul_max_rs
  WINDOWS_TARGET: x86_64-pc-windows-msvc

permissions:
  contents: write

jobs:
  check:
    name: Format, lint & test
    # 发版（tag push）时不阻断：新工具链引入的 lint 不应该拖住发布。
    # 如需改成硬门禁，给 build 加上 `needs: check` 即可。
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install APT packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.APT_PACKAGES }}

      - name: Install toolchain components
        run: rustup update && rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  build:
    name: Build binary (windows, x86_64)
    runs-on: windows-2022
    env:
      # Windows 静态 CRT 只给发版构建用。放到全局 RUSTFLAGS 会让 Linux
      # 上的 proc-macro（clippy/test 需要）编不出来。
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        shell: bash
        run: cargo build --release --target "${WINDOWS_TARGET}"

      - name: Assemble Windows package
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "release-package"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "target/$env:WINDOWS_TARGET/release/$env:BIN_NAME.exe" $packageDir
          Copy-Item -Recurse "liqi_config" $packageDir

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-windows-x86_64
          path: release-package/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archive
        run: |
          archive="${BIN_NAME}-windows-x86_64.zip"
          exe="$(find artifacts -name "${BIN_NAME}.exe" -print -quit)"
          if [ -z "$exe" ]; then
            echo "Windows binary not found in artifacts"
            find artifacts -type f
            exit 1
          fi
          pkg_dir="$(dirname "$exe")"
          (cd "$pkg_dir" && zip -r "${GITHUB_WORKSPACE}/${archive}" .)
          unzip -l "${archive}"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BIN_NAME }}-windows-x86_64.zip
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
